[project]
name = "auto-shorts-generator"
version = "0.1.0"
description = "Automated pipeline: download trending YouTube → extract highlight → crop to 9:16"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
